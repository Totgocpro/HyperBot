services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hyperbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: hyperbot
    ports:
      - "${DATABASE_HOST_BIND:-127.0.0.1}::5432"
    volumes:
      - PostgreSQLData:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperbot -d hyperbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    ports:
      - "${DATABASE_HOST_BIND:-127.0.0.1}::6379"
    volumes:
      - RedisData:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  application:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-22.12.0}
    environment:
      DATABASE_URL: postgresql://hyperbot:${POSTGRES_PASSWORD_URL_ENCODED:?Run Dev.sh, Release.sh, or scripts/EnsureEnv.sh}@postgresql:5432/hyperbot?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD_URL_ENCODED:?Run Dev.sh, Release.sh, or scripts/EnsureEnv.sh}@redis:6379
      SUPER_ADMIN_IDS: ${SUPER_ADMIN_IDS:-}
      PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-true}
      ENABLE_MESSAGE_EVENTS: ${ENABLE_MESSAGE_EVENTS:-true}
      PLUGIN_DIRECTORY: dist/Plugins
      CUSTOM_PLUGIN_DIRECTORY: /app/CustomPlugins
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      TEMPVOICE_YOUTUBE_COOKIES_PATH: ${TEMPVOICE_YOUTUBE_COOKIES_PATH:-}
      YOUTUBE_COOKIES_PATH: ${YOUTUBE_COOKIES_PATH:-}
      TENOR_API_KEY: ${TENOR_API_KEY:-}
      NODE_ENV: production
    ports:
      - "${APP_HOST_BIND:-127.0.0.1}:${APP_HOST_PORT:-}:3000"
    # Optional Temp Voice YouTube auth:
    # volumes:
    #   - ./secrets/youtube-cookies.txt:/run/secrets/youtube-cookies.txt:ro
    volumes:
      - CustomPlugins:/app/CustomPlugins
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  PostgreSQLData:
  RedisData:
  CustomPlugins:
